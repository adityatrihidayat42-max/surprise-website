<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8dce8">
<title>A Little Gift, Just for You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#d985ad;--deep:#a94e80;--ink:#87556c;--paper:#fff8fb}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}
body{font-family:Montserrat,Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#fff7fa,#f8dce9 55%,#f2c7dc);min-height:100svh}
button{font:inherit}
.page{min-height:100svh;display:grid;place-items:center;padding:38px 20px 48px;position:relative;isolation:isolate;overflow:hidden}
.page:before,.page:after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(2px);pointer-events:none}
.page:before{width:360px;height:360px;left:-170px;top:8%;background:#fff9}
.page:after{width:420px;height:420px;right:-210px;bottom:-12%;background:#e7a9c455}
.glow{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1.8px);background-size:38px 38px;opacity:.45}
.wrap{width:min(590px,100%);text-align:center;position:relative;z-index:1}
.kicker{font-size:clamp(10px,2.5vw,13px);font-weight:600;letter-spacing:.48em;color:#a66f87;margin:0 0 76px 0}
.envelope{height:clamp(260px,62vw,390px);width:100%;position:relative;filter:drop-shadow(0 22px 25px #a64d7829);perspective:900px}
.env-back{position:absolute;inset:0;border-radius:0 0 16px 16px;background:linear-gradient(145deg,#e9a9c8,#bd6697);box-shadow:inset 0 0 0 1px #fff8}
.env-front{position:absolute;inset:0;border-radius:0 0 16px 16px;overflow:hidden;background:linear-gradient(145deg,#d98ab0,#b85b91);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-flap{position:absolute;inset:0 0 auto;height:64%;background:linear-gradient(145deg,#fffafd,#f8eaf1);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .85s cubic-bezier(.2,.75,.2,1);z-index:4;filter:drop-shadow(0 5px 4px #8e3e6920)}
.letter{position:absolute;left:8%;right:8%;top:9%;height:78%;border-radius:8px;background:linear-gradient(#fff,#fff6fa);box-shadow:0 8px 20px #8f42641c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:transform .9s cubic-bezier(.2,.75,.2,1);z-index:2}
.letter small{letter-spacing:.25em;font-size:9px;color:#bd83a0}
.letter strong{font:italic 34px "Cormorant Garamond",serif;color:#a9517f}
.letter span{font:10px Montserrat,sans-serif;letter-spacing:.18em;color:#bd83a0}
.seal{position:absolute;z-index:5;left:50%;top:57%;transform:translate(-50%,-50%);width:clamp(112px,20vw,142px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:white;font-size:12px;letter-spacing:.2em;background:radial-gradient(circle at 35% 28%,#f8d8e8,#d77eaa 55%,#a94f80);border:2px solid #fff9;outline:1px solid #fff9;outline-offset:6px;box-shadow:0 8px 22px #7d315a42;z-index:6;transition:opacity .35s,transform .5s}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.envelope.open .letter{transform:translateY(-43%);transition-delay:.18s}
.envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.5)}
.hint{font:italic clamp(21px,5vw,30px) "Cormorant Garamond",serif;color:#a56b84;margin:65px 0 52px}
.primary{width:min(455px,100%);min-height:76px;padding:16px 22px;border:1px solid #fff9;outline:1px solid #e9b9ce;outline-offset:-9px;background:linear-gradient(110deg,#d58caf,#b85e91);box-shadow:0 12px 22px #a64e792b;color:#fff;font-size:13px;font-weight:700;letter-spacing:.36em;cursor:pointer;transition:transform .2s,filter .2s}
.primary:active{transform:translateY(2px) scale(.99)}
.primary:focus-visible,.again:focus-visible{outline:3px solid #8e3e69;outline-offset:4px}
.reveal{display:none;position:fixed;inset:0;z-index:10;place-items:center;padding:24px;background:radial-gradient(circle at 50% 40%,#fff8fc 0,#f4c6dc 50%,#d987b0 100%);opacity:0}
.reveal.show{display:grid;animation:revealIn .55s ease forwards}
@keyframes revealIn{to{opacity:1}}
.reveal-card{width:min(480px,100%);text-align:center;padding:25px 20px 28px;border:1px solid #fff9;background:#fff8fbe8;box-shadow:0 20px 55px #813b602c;border-radius:10px;transform:scale(.82) rotate(-2deg);animation:pop .65s .1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes pop{to{transform:scale(1) rotate(0)}}
.reveal-kicker{font-size:10px;letter-spacing:.35em;color:#a56b84}
.hand{width:min(260px,70vw);height:260px;margin:8px auto 0;display:block;filter:drop-shadow(0 12px 8px #8e3e6933)}
.reveal h1{font:italic 42px "Cormorant Garamond",serif;color:#a94e80;margin:0 0 3px}
.reveal p{font-size:13px;line-height:1.7;color:#94647b;margin:0 auto 18px}
.again{border:1px solid #dca5bf;background:#fff;color:#a94e80;padding:12px 20px;font-size:10px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:7px;height:13px;background:#fff;border-radius:2px;animation:fall 2.8s linear infinite}
.confetti i:nth-child(3n){background:#b75c91}.confetti i:nth-child(3n+1){background:#f5c7dc}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:420px){.kicker{margin-bottom:58px}.hint{margin:52px 0 42px}.primary{min-height:68px;font-size:11px}.envelope{height:270px}.reveal h1{font-size:36px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="page">
 <div class="glow" aria-hidden="true"></div>
 <section class="wrap" aria-label="Hadiah rahasia">
  <p class="kicker">A LITTLE GIFT, JUST FOR YOU</p>
  <div class="envelope" id="envelope">
   <div class="env-back"></div>
   <div class="letter"><small>SEBUAH KEJUTAN KECIL</small><strong>Untukmu</strong><span>DIBUKA DENGAN SENYUM</span></div>
   <div class="env-front"></div><div class="env-flap"></div>
   <div class="seal">UNTUKMU</div>
  </div>
  <p class="hint" id="hint">ada sesuatu yang ingin kuberikan</p>
  <button class="primary" id="open" type="button">BUKA HADIAHMU</button>
 </section>
</main>
<section class="reveal" id="reveal" role="dialog" aria-modal="true" aria-labelledby="revealTitle">
 <div class="confetti" aria-hidden="true"><i style="left:5%;animation-delay:.1s"></i><i style="left:13%;animation-delay:.8s"></i><i style="left:23%;animation-delay:.4s"></i><i style="left:34%;animation-delay:1.2s"></i><i style="left:47%;animation-delay:.2s"></i><i style="left:58%;animation-delay:1s"></i><i style="left:69%;animation-delay:.5s"></i><i style="left:81%;animation-delay:1.4s"></i><i style="left:93%;animation-delay:.3s"></i></div>
 <div class="reveal-card">
  <div class="reveal-kicker">SURPRISE! TERTIPU KAMU 🤭</div>
  <svg class="hand" viewBox="0 0 260 260" role="img" aria-label="Ilustrasi tangan memberi jari tengah">
   <defs><linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd8c9"/><stop offset="1" stop-color="#e99b91"/></linearGradient></defs>
   <path d="M82 226 Q65 218 62 196 L50 145 Q46 127 61 121 Q76 116 83 134 L96 165 L95 38 Q95 17 113 17 Q132 17 132 39 L133 133 L139 68 Q141 49 158 51 Q176 53 173 73 L165 139 L177 98 Q184 81 200 88 Q215 95 207 114 L190 166 L203 145 Q214 130 227 142 Q239 153 226 170 L197 220 Q185 241 160 243 L112 245 Q93 244 82 226Z" fill="url(#skin)" stroke="#b86b70" stroke-width="5" stroke-linejoin="round"/>
   <path d="M101 38 Q103 25 114 26 Q125 27 125 40" fill="none" stroke="#fff0e9" stroke-width="5" stroke-linecap="round"/>
   <path d="M143 69 Q146 59 157 61" fill="none" stroke="#fff0e9" stroke-width="4" stroke-linecap="round"/>
   <path d="M187 105 Q192 97 201 102" fill="none" stroke="#fff0e9" stroke-width="4" stroke-linecap="round"/>
   <path d="M75 144 Q81 152 84 163" fill="none" stroke="#d98983" stroke-width="4" stroke-linecap="round"/>
  </svg>
  <h1 id="revealTitle">HAHAHA KENA PRANK! 💗</h1>
  <p>Kirain dapat hadiah spesial, ya? EHH malah dapat salam satu jari. Jangan marah, bercanda doang! 😭</p>
  <button class="again" id="again" type="button">ULANGI PRANK-NYA</button>
 </div>
</section>
<script>
const envelope=document.getElementById('envelope');
const openButton=document.getElementById('open');
const reveal=document.getElementById('reveal');
const hint=document.getElementById('hint');
let opened=false;
openButton.addEventListener('click',()=>{
 if(opened)return;
 opened=true;
 envelope.classList.add('open');
 hint.textContent='sebentar... ada kejutan untukmu';
 openButton.textContent='MENYIAPKAN KEJUTAN...';
 openButton.disabled=true;
 window.setTimeout(()=>reveal.classList.add('show'),950);
});
function resetPrank(){
 reveal.classList.remove('show');
 envelope.classList.remove('open');
 hint.textContent='ada sesuatu yang ingin kuberikan';
 openButton.textContent='BUKA HADIAHMU';
 openButton.disabled=false;
 opened=false;
}
document.getElementById('again').addEventListener('click',resetPrank);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&reveal.classList.contains('show'))resetPrank()});
</script>
</body>
</html>
